[project]
name = "solo-decisions"
version = "0.1.0"
description = "Decisions cell: decision records, history and reviews, with its own database"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "sentry-sdk>=2.72,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "pgserver>=0.1.4",
    "mcp>=2.3,<3",
    "mypy>=2.4",
]
mcp = ["mcp>=2.3,<3"]  # decisions-mcp (solo_decisions.mcp_server); not needed by the API image

[project.scripts]
decisions-api = "solo_decisions.app:main"
decisions-publish = "solo_decisions.publisher:main"
decisions-db = "solo_decisions.db:main"
decisions-mcp = "solo_decisions.mcp_server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "BLE", "UP", "C4", "SIM", "RUF", "PIE", "PT", "RET", "ISC",
    "PERF", "LOG", "G", "FURB",
]
# ruff format wraps code at 88; what stays longer are nosemgrep/noqa justifications, which
# must sit on the flagged line.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

# Service code: mypy --strict (the global-only strict flags are set above). tests/ stays gradual:
# its fixtures and test functions are unannotated, so mypy checks only their call sites.
[[tool.mypy.overrides]]
module = ["solo_decisions.*"]
check_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_reexport = true
warn_return_any = true

# tests/test_e2e_platform.py runs only next to a sibling empire-platform checkout (skipped in CI).
[[tool.mypy.overrides]]
module = ["empire_platform.*", "platform_api.*", "tasks_api.*"]
ignore_missing_imports = true
